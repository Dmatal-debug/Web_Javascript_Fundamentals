<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Web Page</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1 id="title">freeCodeCamp Survey Form</h1>
        <p id="description">Thank you for taking the time to help us improve the platform</p>

        <form id="survey-form">
            <label id="name-label">Name
                <input id="name" type="text" placeholder="Enter your name" required>
            </label>
            <br>

            <label id="email-label">Email
                <input id="email" type="email" placeholder="Enter your email" required>
            </label>
            <br>

            <label id="number-label">Age
                <input id="number" type="number" placeholder="Enter your age" min="10" max="99" required>
            </label>
            <br>

            <label for="dropdown">Which option best describes your current role?</label>
            <select id="dropdown" required>
                <option value="" disabled selected>Select an option</option>
                <option value="student">Student</option>
                <option value="developer">Developer</option>
                <option value="other">Other</option>
            </select>
            <br>

            <p>How did you hear about this survey?</p>
            <label>
                <input type="radio" name="referral" value="social-media"> Social media
            </label>
            <br>
            <label>
                <input type="radio" name="referral" value="friend"> Friend
            </label>
            <br>
            <label>
                <input type="radio" name="referral" value="other"> Other
            </label>
            <br>

            <p>Which features would you like to see improved? (check all that apply)</p>
            <label>
                <input type="checkbox" value="performance"> Performance
            </label>
            <br>
            <label>
                <input type="checkbox" value="usability"> Usability
            </label>
            <br>
            <label>
                <input type="checkbox" value="design"> Design
            </label>
            <br>

            <label for="comments">Any additional comments?</label>
            <br>
            <textarea id="comments" rows="5" placeholder="Enter your comments here..."></textarea>
            <br>

            <button id="submit" type="submit">Submit</button>
        </form>
    </body>
</html>
